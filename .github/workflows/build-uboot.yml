name: Build U-Boot (bcm96855)

on:
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: 'u-boot 版本/tag（默认 v2024.04，主线已含 bcm96855 支持）'
        required: false
        default: 'v2024.04'
  push:
    tags: ['uboot-v*']

permissions:
  contents: write

jobs:
  uboot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      UBOOT_REF: ${{ inputs.uboot_ref || 'v2024.04' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bison flex \
            gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf libssl-dev swig \
            python3-pyelftools device-tree-compiler u-boot-tools bc

      - name: Fetch U-Boot
        run: |
          git clone --depth 1 --branch "${UBOOT_REF}" https://github.com/u-boot/u-boot.git u-boot
          cd u-boot && git log -1 --format='%H %s'

      - name: Apply board overlay
        run: |
          # 本仓库的 board 补丁/环境脚本（若存在）
          if [ -d port/uboot/files ]; then cp -rv port/uboot/files/. u-boot/; fi
          if [ -f port/uboot/bcm96855_defconfig ]; then
            cp port/uboot/bcm96855_defconfig u-boot/configs/bcm96855_defconfig
          fi
          ls port/uboot 2>/dev/null || true

      - name: Build U-Boot
        run: |
          cd u-boot
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make bcm96855_defconfig
          make -j$(nproc)
          ls -lh u-boot.bin u-boot.dtb 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p out
          cp -v u-boot/u-boot.bin out/ 2>/dev/null || true
          cp -v u-boot/u-boot.dtb out/ 2>/dev/null || true
          cp -v u-boot/System.map out/ 2>/dev/null || true
          cp -v port/uboot/uEnv.txt out/ 2>/dev/null || true
          cd out && sha256sum * > SHA256SUMS 2>/dev/null || true && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: uboot-bcm96855-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/uboot-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "U-Boot bcm96855 ${GITHUB_REF_NAME}" \
            --notes "主线 U-Boot（${UBOOT_REF}）bcm96855 构建产物。注意：主线版为 RAM 引导配置，NAND 启动仍需厂商 SPL/TPL，勿直接覆盖 loader 分区。" \
            --prerelease
