name: Build OpenWrt firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      config_file:
        description: '可选：仓库内自定义 .config（默认 port/configs/mb4784w.config）'
        required: false
        default: ''
      openwrt_ref:
        description: '可选：覆盖 port/sources.lock.json 的 openwrt commit'
        required: false
        default: ''
      skip_download:
        description: '跳过 make download（缓存已全时省时间）'
        type: boolean
        required: false
        default: false
      enable_enet:
        description: '把 kmod-bcm-enet（4 个 LAN 口驱动）编进镜像'
        type: boolean
        required: false
        default: false
      module_only:
        description: '快速通道：只编 bcm_enet.ko（依赖内核构建树缓存，3-6 分钟）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: openwrt-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware:
    name: bcmbca / HG3142F
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CONFIG_FILE: ${{ inputs.config_file || 'port/configs/mb4784w.config' }}
      OPENWRT_REF_OVERRIDE: ${{ inputs.openwrt_ref }}
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start timing
        run: |
          echo "job_start $(date +%s) mode=${{ inputs.module_only && 'module' || 'full' }}" > timing.marks
          echo "mode=$( [ "${{ inputs.module_only }}" = "true" ] && echo module-only || echo full )"

      - name: Free disk space and add swap
        if: ${{ inputs.module_only != true }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet 2>/dev/null || true
          sudo apt-get purge -y 'dotnet*' 'aspnetcore*' 'llvm-*' 'clang-*' 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h /

      - name: Install build dependencies
        if: ${{ inputs.module_only != true }}
        run: |
          sudo apt-get update
          # 注意：ecj / fastjar 在 Ubuntu 24.04 已移除，不要加回来（会导致 apt exit 100）
          sudo apt-get install -y build-essential clang-18 llvm-18 lld-18 flex bison gawk gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools python3-dev \
            rsync unzip zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev libfuse-dev pkgconf bc time subversion
          sudo apt-get clean

      - name: Install minimal deps (module-only)
        if: ${{ inputs.module_only }}
        run: |
          # 快速通道只做 defconfig + 一个外部模块，不需要整套 OpenWrt 依赖。
          # scripts/config/conf 要 ncurses 头，内核 Makefile 要 bc。
          sudo apt-get install -y --no-install-recommends bc libncurses-dev zlib1g-dev libelf-dev
      - name: Prepare OpenWrt source with bcmbca overlay
        run: |
          sh port/scripts/prepare.sh sources/openwrt
          cd sources/openwrt
          echo "OpenWrt commit: $(git rev-parse HEAD)"
          ls target/linux | grep -x bcmbca
          cd ..
          echo "prepare $(date +%s)" >> timing.marks

      - name: Restore download directory cache
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: sources/openwrt/dl
          key: openwrt-dl-${{ hashFiles('port/sources.lock.json') }}
          restore-keys: openwrt-dl-

      - name: Restore toolchain cache
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sources/openwrt/staging_dir
            sources/openwrt/build_dir/toolchain-*
          key: openwrt-tc-${{ hashFiles('port/sources.lock.json') }}
          restore-keys: openwrt-tc-

      # 内核构建树缓存：module-only 快速通道的关键。
      # key 绑定：源码锁文件内容 + bcmbca target overlay（config/patches/dts）内容。
      # 只缓存 linux-* 内核树与 target staging（toolchain 由上面的 tc 缓存负责）。
      - name: Restore kernel build tree cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            sources/openwrt/build_dir/target-*/linux-*/
            sources/openwrt/staging_dir/target-*/
          key: openwrt-kernel-${{ hashFiles('port/sources.lock.json') }}-${{ hashFiles('port/overlay/target/linux/bcmbca/**') }}
          restore-keys: |
            openwrt-kernel-${{ hashFiles('port/sources.lock.json') }}-
            openwrt-kernel-

      - name: Update and install feeds
        run: |
          cd sources/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "feeds $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

      - name: Configure
        run: |
          cd sources/openwrt
          cp "../../${CONFIG_FILE}" .config
          if [ "${{ inputs.enable_enet }}" = "true" ]; then
            echo "CONFIG_PACKAGE_kmod-bcm-enet=m" >> .config
            echo "==> 本轮把 kmod-bcm-enet 编进镜像"
          fi
          make defconfig
          echo "=== 关键配置校验 ==="
          for k in CONFIG_TARGET_bcmbca=y CONFIG_TARGET_bcmbca_generic=y \
                   CONFIG_TARGET_bcmbca_generic_DEVICE_fiberhome_mb4784w=y; do
            grep -qx "$k" .config || { echo "::error::缺少 $k（target 骨架或 device 定义未生效）"; exit 1; }
          done
          grep -E "CONFIG_TARGET_|CONFIG_KERNEL_" .config | head -20
          echo "configure $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

      - name: Generate complete kernel config
        run: |
          cd sources/openwrt
          TOP="$(pwd)"
          exec > >(tee "$TOP/config.log") 2>&1
          # 有内核树缓存时跳过解包（module-only 快速通道）；没有才 prepare
          KDIR=$(find build_dir -maxdepth 4 -type d -name 'linux-6.18*' | head -1)
          if [ -z "$KDIR" ]; then
            echo "内核树不存在，先 make target/linux/prepare"
            make target/linux/prepare V=s 2>&1 | tail -5 || true
            KDIR=$(find build_dir -maxdepth 4 -type d -name 'linux-6.18*' | head -1)
          fi
          echo "KDIR=$KDIR" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$KDIR" ]; then
            echo "::error::没找到内核目录，无法生成配置"
            exit 1
          fi

          CFG="$TOP/target/linux/bcmbca/config-6.18"

          # 1) 复刻 OpenWrt 的合并：generic/config-6.18 + target/config-6.18
          #    直接用内核自己的 .config 解析器（同名符号后者覆盖前者），
          #    避开 kconfig.pl 对参数个数的严格要求
          cat target/linux/generic/config-6.18 target/linux/bcmbca/config-6.18 > "$KDIR/.config"

          # 2) 打开本机需要的 BCMBCA / 外设选项
          cd "$KDIR"
          ./scripts/config --file .config \
            --enable ARCH_BCM \
            --enable ARCH_BCMBCA \
            --enable ARCH_BCMBCA_CORTEXA7 \
            --enable ARM_LPAE \
            --enable SMP \
            --set-val NR_CPUS 3 \
            --enable ARM_AMBA \
            --enable SERIAL_AMBA_PL011 \
            --enable SERIAL_AMBA_PL011_CONSOLE \
            --enable MTD \
            --enable MTD_NAND_BRCMNAND \
            --enable MTD_NAND_BRCMNAND_BCMBCA \
            --enable MTD_UBI \
            --enable MTD_UBI_BLOCK \
            --enable MTD_CMDLINE_PARTS \
            --enable PINCTRL_BCM63XX \
            --enable CLK_BCM_63XX \
            --disable MTD_BRCM_U_BOOT

          # 3) olddefconfig 永不提问：把所有「因依赖变可见」的符号按默认值补齐
          make ARCH=arm olddefconfig

          # 4) 写回 target 配置 → 构建时 syncconfig 就没有新符号可问
          cp .config "$CFG"
          echo "配置行数: $(wc -l < "$CFG")" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^CONFIG_(ARCH_BCM|ARCH_BCMBCA|ARCH_BCMBCA_CORTEXA7|SERIAL_AMBA_PL011|MTD_NAND_BRCMNAND|ARM_LPAE|NR_CPUS|SMP)' "$CFG" >> "$GITHUB_STEP_SUMMARY" || true
          echo "kernel_config $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

      - name: Download package sources
        if: ${{ !inputs.skip_download }}
        run: |
          cd sources/openwrt
          make download -j8 || make download -j1 V=s

      - name: Build
        id: build
        if: ${{ inputs.module_only != true }}
        run: |
          cd sources/openwrt
          # 完整日志落盘，便于失败时生成可下载的错误摘要
          set -o pipefail
          yes "" | make -j$(nproc) 2>&1 | tee build.log | tail -120 || make -j1 V=s 2>&1 | tee build.log | tail -120
          echo "full_build $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

      # ------------------------------------------------------------------
      # 快速通道：只编 bcm_enet.ko（module_only=true）
      # 依赖上面恢复的内核构建树缓存；未命中则自愈跑一次完整构建。
      # ------------------------------------------------------------------
      - name: Module-only build (bcm_enet)
        id: module_build
        if: ${{ inputs.module_only }}
        run: |
          cd sources/openwrt

          # 1) 缓存未命中 → 自愈：先完整构建一次，成功后由后面的 Save 步骤写缓存
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::内核构建树缓存未命中，先跑一次完整构建（本次会慢，下次 3-6 分钟）"
            # 与完整构建相同的写法：yes 的 SIGPIPE 不能算失败，所以不用 pipefail
            yes "" | make -j$(nproc) 2>&1 | tee build.log | tail -60 || make -j1 V=s 2>&1 | tee build.log | tail -60
          fi
          echo "kernel_ready $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

          # 2) 确保包被选中（注意不能 grep 子串：注释行 "# CONFIG_PACKAGE_... is not set" 也会命中）
          if ! grep -qx 'CONFIG_PACKAGE_kmod-bcm-enet=m' .config; then
            echo 'CONFIG_PACKAGE_kmod-bcm-enet=m' >> .config
            make defconfig >/dev/null
          fi
          grep -n 'CONFIG_PACKAGE_kmod-bcm-enet' .config | head -3 || true
          if ! grep -qx 'CONFIG_PACKAGE_kmod-bcm-enet=m' .config; then
            echo "::error::CONFIG_PACKAGE_kmod-bcm-enet 仍未选中"
            grep -n 'bcm-enet' tmp/.config-package.in 2>/dev/null | head -5 || true
            exit 1
          fi

          # 3) 只编这个包；clean 保证每次都重新编 compat 层
          time make package/bcm-enet/clean package/bcm-enet/compile V=s 2>&1 | tee ../../module_build.log
          echo "module_build $(date +%s)" >> "$GITHUB_WORKSPACE/timing.marks"

          # 4) 收集产物与日志（先拷日志，失败时也能在 artifact 里看到真实错误）
          mkdir -p ../../out
          cp ../../module_build.log ../../out/module_build.log 2>/dev/null || true
          KO=$(find build_dir -path '*bcm-enet*/bcm_enet.ko' -type f 2>/dev/null | head -1)
          OBJ=$(find build_dir -path '*bcm-enet*/bcm_enet.o' -type f 2>/dev/null | head -1)
          NM=$(find "$PWD/staging_dir" -path '*toolchain-*/bin/*-nm' 2>/dev/null | head -1)
          SYMV=$(find build_dir -maxdepth 6 -name Module.symvers -path '*linux-6.18*' 2>/dev/null | head -1)
          if [ -n "$NM" ] && { [ -n "$KO" ] || [ -n "$OBJ" ]; }; then
            TARGET=${KO:-$OBJ}
            "$NM" -u "$TARGET" | awk '{print $NF}' | sort -u > ../../out/undefined_symbols_raw.txt || true
            if [ -n "$SYMV" ]; then
              # 只保留「内核没有导出」的符号 —— 就是 insmod 会被拒的那批
              awk '{print $2}' "$SYMV" | sort -u > /tmp/kernel_exports.txt
              comm -23 ../../out/undefined_symbols_raw.txt /tmp/kernel_exports.txt > ../../out/undefined_symbols.txt || true
            else
              cp ../../out/undefined_symbols_raw.txt ../../out/undefined_symbols.txt || true
            fi
          fi
          if [ -s ../../out/undefined_symbols.txt ]; then
            echo "::warning::未决符号 $(wc -l < ../../out/undefined_symbols.txt) 个（模块无法 insmod）"
            head -40 ../../out/undefined_symbols.txt
          fi
          if [ -n "$KO" ]; then
            cp -v "$KO" ../../out/bcm_enet.ko
            echo "bcm_enet.ko: $(stat -c%s ../../out/bcm_enet.ko) 字节"
          else
            echo "::error::module-only 未产出 bcm_enet.ko"
            grep -nE "error:|fatal error:|Error [0-9]+" ../../module_build.log | head -40 || true
            tail -60 ../../module_build.log || true
            exit 1
          fi
          [ -f ../../probe_enet_sdk.log ] && cp ../../probe_enet_sdk.log ../../out/probe_enet_sdk.log || true

      - name: Summarize build failure
        if: failure()
        run: |
          cd sources/openwrt
          {
            echo "=== 失败点（make 错误行） ==="
            grep -nE "Error [0-9]+|error:|\*\*\* |No such file|not found" build.log 2>/dev/null | tail -60 || true
            echo
            echo "=== 日志尾部 ==="
            tail -80 build.log 2>/dev/null || true
            echo
            echo "=== bcm-pcie 包构建上下文 ==="
            grep -nE -A6 -B6 "bcm-pcie|pcie_hcd|pcie-bcm963xx" build.log 2>/dev/null | tail -80 || true
            echo
            echo "=== 配置步骤日志尾部 ==="
            tail -40 config.log 2>/dev/null || true
          } > ../../build_error.txt 2>/dev/null || true
          echo "build_error.txt 行数: $(wc -l < ../../build_error.txt 2>/dev/null || echo 0)"
          echo "----- build_error.txt 前 120 行 -----"
          head -120 ../../build_error.txt 2>/dev/null || true

      - name: SDK compile probe (bcm_enet)
        if: always() && inputs.module_only != true
        continue-on-error: true
        run: |
          set +e
          echo "=== SDK compile probe: build bcm_enet against 6.18 kernel ==="
          TOP="$(pwd)"
          KDIR=$(find "$TOP/sources/openwrt/build_dir" -maxdepth 4 -type d -name 'linux-6.18*' 2>/dev/null | head -1)
          if [ -z "$KDIR" ]; then echo "kernel dir not found, skip probe"; exit 0; fi
          echo "KDIR=$KDIR"
          TOP="$(pwd)"
          SDK="$TOP/port/sdk-bcm96855/sdk"
          COMPAT="$TOP/port/sdk-bcm96855/compat"
          ENET="$SDK/bcmdrivers/opensource/net/enet/impl7"
          PROBE="$TOP/probe"
          rm -rf "$PROBE"; mkdir -p "$PROBE"
          printf '%s\n' \
            'obj-m := bcm_enet.o' \
            'bcm_enet-y := enet.o port.o runner.o dt_parsing.o g9991.o mux_index.o phy_drv_pon.o sw_common.o port_types.o phy_drv_compat.o enet_stubs.o enet_framework_stubs.o bcm_chip_arch_compat.o bcmkernel_stubs.o' \
            > "$PROBE/Kbuild"
          for f in enet port runner dt_parsing g9991 mux_index phy_drv_pon sw_common port_types; do
            ln -sf "$ENET/$f.c" "$PROBE/$f.c"
          done
          # 我们自己补的 PHY 框架实现（原厂只有 prebuilt phy_drv.o），一起编进来
          ln -sf "$COMPAT/phy_drv_compat.c" "$PROBE/phy_drv_compat.c"
          ln -sf "$COMPAT/enet_stubs.c" "$PROBE/enet_stubs.c"
          ln -sf "$COMPAT/enet_framework_stubs.c" "$PROBE/enet_framework_stubs.c"
          ln -sf "$COMPAT/bcm_chip_arch_compat.c" "$PROBE/bcm_chip_arch_compat.c"
          ln -sf "$COMPAT/bcmkernel_stubs.c" "$PROBE/bcmkernel_stubs.c"
          GCC=$(find "$TOP/sources/openwrt/staging_dir" -path '*toolchain-*/bin/*-gcc' 2>/dev/null | head -1)
          if [ -z "$GCC" ]; then echo "cross gcc not found, skip"; exit 0; fi
          export PATH="$(dirname "$GCC"):$PATH"
          CROSS=$(basename "$GCC" | sed 's/gcc$//')
          echo "CROSS=$CROSS"
          BDMF="$SDK/bcmdrivers/opensource/char/bdmf/impl1"
          INC="-I$COMPAT -I$ENET -I$SDK/bcmdrivers/opensource/net/enet/shared -I$SDK/bcmdrivers/opensource/include/bcm963xx -I$SDK/bcmdrivers/broadcom/include/bcm963xx -I$SDK/shared/opensource/include/bcm963xx -I$SDK/rdp/drivers/rdpa_gpl/include -I$SDK/rdp/drivers/rdpa_gpl/include/autogen -I$SDK/kernel/bcmkernel/include -I$SDK/kernel/bcmkernel/include/uapi -I$SDK/bcmdrivers/opensource/phy -I$BDMF/framework -I$BDMF/system -I$BDMF/system/linux -I$BDMF/system/linux/cm"
          # 6.18 的 sk_buff 已无 queue 成员（4.1 由 Broadcom patch 加）；探针阶段临时去掉对应 accessor
          sed -i '/__BUILD_NBUFF_\(SET\|GET\)_ACCESSOR(.*queue/d' "$SDK/kernel/bcmkernel/include/linux/nbuff.h" || true
          # 6.18 已移除 struct switchdev_ops；探针阶段跳过该字段
          # 只关这四个文件：runner_common.h 的 #ifdef 里是 switchdev_attr/trans 原型，
          # 6.18 没有这些结构，会被 -Werror 当成 "declared inside parameter list"。
          # 注意不要动 enet_inline_platform.h —— 它在同一宏里 include <linux/nbuff.h>，
          # 关掉会让 FkBuff_t 等类型在 enet.c 里失踪。
          sed -i 's/#if defined(CONFIG_NET_SWITCHDEV)/#if 0/; s/#ifdef CONFIG_NET_SWITCHDEV/#if 0/' \
                 "$ENET/port.h" "$ENET/enet.c" "$ENET/g9991.c" "$ENET/runner_common.h" || true
          # dt_parsing.c 里 #include "drivers/bcm_chip_arch.c" 是厂商生成文件，GPL 包没带；
          # 换成 compat/bcm_chip_arch_compat.c 提供的同名数组（该文件单独编进模块）
          sed -i 's|#include "drivers/bcm_chip_arch.c"|#include <bcm_chip_arch.h>|' "$ENET/dt_parsing.c" || true
          # 6.18 的 of_platform.h 不再顺带 include platform_device.h，
          # dt_parsing.c 用了 struct platform_device/platform_driver -> 显式补上
          sed -i 's|#include <linux/of_platform.h>|#include <linux/of_platform.h>\n#include <linux/platform_device.h>|' "$ENET/dt_parsing.c" || true
          # runner.c 的 struct ethswctl_data 来自 <bcm/bcmswapitypes.h>，而 runner.h
          # 只在 CONFIG_BCM96855 等芯片宏下才 include 它；我们暂不定义芯片宏
          # （会额外打开 6855 专属代码），先在这里显式补 include
          sed -i 's|#include <net_port.h>|#include <net_port.h>\n#include <bcm/bcmswapitypes.h>|' "$ENET/runner.c" || true
          # autogen 的 rdpa_ag_iptv.h 未 include rdpa_mcast.h，导致 rdpa_fc_mcast_flow_t 未定义；探针阶段替换为 key_t
          sed -i 's/rdpa_fc_mcast_flow_t/rdpa_fc_mcast_flow_key_t/g' "$SDK/rdp/drivers/rdpa_gpl/include/autogen/rdpa_ag_iptv.h" || true
          # 不能 include bcm_skbuff.h/bcm_netdevice.h（会整体替换 sk_buff/net_device，与 6.18 冲突）
          # 厂商私有类型统一由 compat/enet_compat.h 打桩。
          # 6.18 的 sk_buff 无 recycle_flags（Broadcom patch 成员），探针阶段注释掉
          sed -i 's|skb->recycle_flags &= SKB_NO_RECYCLE;|/* compat: no recycle_flags in 6.18 */|' "$ENET/enet.c" || true
          sed -i 's#skb->recycle_flags |= rx_info->extra_skb_flags;#/* compat */#' "$ENET/enet.c" || true
          # 卸载/初始化失败时停掉 compat 的 PHY 轮询 workqueue，否则模块被卸载后
          # 定时器仍在跑（work 函数代码已不在）→ 内核崩。插在退出日志之前。
          sed -i 's|^    enet_err("ENET system destructed|    phy_drv_compat_exit();\n    enet_err("ENET system destructed|' "$ENET/enet.c" || true
          export STAGING_DIR="$TOP/sources/openwrt/staging_dir"
          # -k：遇错不停，一轮把 enet/port/runner/... 所有文件的错误全暴露出来
          make -k -C "$KDIR" M="$PROBE" ARCH=arm CROSS_COMPILE="$CROSS" \
               KBUILD_MODPOST_WARN=1 \
               KCFLAGS="$INC -include $COMPAT/enet_compat.h -include $COMPAT/phy_drv_compat.h -include $COMPAT/nbuff_types_stub.h -include $COMPAT/nbuff_outer_stub.h -DCONFIG_BCM_ENET -DENET_DT -DCONFIG_BCM_PON=1 -DCONFIG_BCM_EXT_SWITCH_TYPE=0 -Wno-error=ignored-qualifiers -Wno-error=cpp -Wno-error=cast-function-type -Wno-error=undef -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=return-mismatch -Wno-error=unused-function -Wno-error=discarded-qualifiers -Wno-error=missing-prototypes -Wno-error=old-style-declaration -Wno-error=unused-variable -Wno-error=override-init -Wno-error=address -Wno-vla-larger-than -Wno-error=vla" \
               modules >probe_full.txt 2>&1
          RC=$?
          echo "probe rc=$RC"
          echo "=== first 120 lines of probe output ==="
          head -120 probe_full.txt || true
          echo "=== error lines (error:) ==="
          grep -nE "error:|fatal error:" probe_full.txt | head -60 || true
          echo "=== error count ==="
          grep -cE "error:|fatal error:" probe_full.txt || true
          # 模块链接允许未解析符号（modpost 只告警），insmod 时才会报 Unknown symbol。
          # 这里把完整清单打出来，下一轮按它补桩。
          echo "=== modpost undefined symbols ==="
          grep -E "undefined!" probe_full.txt | sed -n 's/.*modpost: "\([^"]*\)".*/\1/p' | sort -u | head -300 || true
          echo "=== undefined count ==="
          grep -cE "undefined!" probe_full.txt || true
          # 编出来就直接把 .ko 拿出来（不用等 OpenWrt 包被 .config 选中）
          if [ -f "$PROBE/bcm_enet.ko" ]; then
            mkdir -p out && cp -v "$PROBE/bcm_enet.ko" out/ && \
              echo "bcm_enet.ko: $(stat -c%s out/bcm_enet.ko) 字节" && \
              modinfo out/bcm_enet.ko 2>/dev/null | head -5 || true
          else
            echo "没有 bcm_enet.ko（编译失败）"
          fi
          # 探针日志必须进 artifacts：只有 task 日志的话，没有 gh CLI 就完全看不到
          mkdir -p out && cp probe_full.txt out/probe_enet_sdk.log || true

      - name: Package probe (kmod-bcm-enet)
        if: always() && inputs.module_only != true
        continue-on-error: true
        run: |
          set +e
          echo "=== package probe: 用仓库里的 bcm-enet 包实际编译一次 ==="
          cd sources/openwrt
          # 这个包默认不进镜像。注意：没被 .config 选中时 `package/xxx/compile`
          # 是**空操作**（0.03 秒就"成功"，但根本不产生 .ko），所以这里临时打开它。
          if ! grep -q 'CONFIG_PACKAGE_kmod-bcm-enet' .config; then
            echo "CONFIG_PACKAGE_kmod-bcm-enet=m" >> .config
            make defconfig >/dev/null 2>&1
            echo "(已临时把 kmod-bcm-enet 加进 .config 以便真正编译)"
          else
            echo "(本轮 .config 已选中该包)"
          fi
          make package/bcm-enet/compile V=s > ../../pkg_enet.log 2>&1
          echo "rc=$?"
          echo "=== error lines ==="
          grep -nE "error:|fatal error:|Error [0-9]+" ../../pkg_enet.log | head -60 || true
          echo "=== error count ==="
          grep -cE "error:|fatal error:" ../../pkg_enet.log || true
          echo "=== tail 40 ==="
          tail -40 ../../pkg_enet.log || true
          echo "=== 产出的 .ko / 模块清单 ==="
          ls -l build_dir/target-*/linux-*/bcm-enet*/bcm_enet.ko 2>/dev/null || echo "没有 .ko"
          mkdir -p ../../out && cp ../../pkg_enet.log ../../out/probe_pkg_enet.log || true

      - name: SDK compile probe (bcm_pcie)
        if: always() && inputs.module_only != true
        continue-on-error: true
        run: |
          set +e
          echo "=== SDK compile probe: build BCM963xx PCIe host driver against 6.18 ==="
          TOP="$(pwd)"
          KDIR=$(find "$TOP/sources/openwrt/build_dir" -maxdepth 4 -type d -name 'linux-6.18*' 2>/dev/null | head -1)
          if [ -z "$KDIR" ]; then echo "kernel dir not found, skip probe"; exit 0; fi
          SDK="$TOP/port/sdk-bcm96855/sdk"
          COMPAT="$TOP/port/sdk-bcm96855/compat"
          PCIE="$SDK/bcmdrivers/opensource/bus/pci/host/impl1"
          PROBE2="$TOP/probe_pcie"
          rm -rf "$PROBE2"; mkdir -p "$PROBE2"
          printf '%s\n' \
            'obj-m := bcm_pcie.o' \
            'bcm_pcie-y := pcie-bcm963xx.o pcie_hcd.o pcie-vcore.o pcie_stubs.o' \
            > "$PROBE2/Kbuild"
          for f in pcie-bcm963xx pcie_hcd pcie-vcore; do
            ln -sf "$PCIE/$f.c" "$PROBE2/$f.c"
          done
          ln -sf "$COMPAT/pcie_stubs.c" "$PROBE2/pcie_stubs.c"
          GCC=$(find "$TOP/sources/openwrt/staging_dir" -path '*toolchain-*/bin/*-gcc' 2>/dev/null | head -1)
          if [ -z "$GCC" ]; then echo "cross gcc not found, skip"; exit 0; fi
          export PATH="$(dirname "$GCC"):$PATH"
          CROSS=$(basename "$GCC" | sed 's/gcc$//')
          echo "CROSS=$CROSS"
          INC="-I$COMPAT -I$PCIE -I$SDK/bcmdrivers/opensource/include/bcm963xx -I$SDK/bcmdrivers/opensource/include/bcm963xx/pmc -I$SDK/shared/opensource/include/bcm963xx -I$SDK/bcmdrivers/broadcom/include/bcm963xx -I$SDK/kernel/bcmkernel/include -I$SDK/kernel/bcmkernel/include/uapi"
          export STAGING_DIR="$TOP/sources/openwrt/staging_dir"
          make -C "$KDIR" M="$PROBE2" ARCH=arm CROSS_COMPILE="$CROSS" \
               KCFLAGS="$INC -DCONFIG_BCM96855 -DCONFIG_BCM_CHIP_NUMBER=6855 -DCONFIG_BCM_PCIE_PMC_BRD_STUBS -DCONFIG_BCM_PCIE_HCD_IMPL=1 -DCONFIG_BCM_PCIE_VCD -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=return-mismatch -Wno-error=unused-function -Wno-error=unused-variable -Wno-error=missing-prototypes -Wno-error=old-style-declaration -Wno-error=discarded-qualifiers -Wno-error=address -Wno-error=override-init" \
               modules >probe_pcie.txt 2>&1
          RC=$?
          echo "probe rc=$RC"
          echo "=== first 100 lines of pcie probe output ==="
          head -100 probe_pcie.txt || true
          echo "=== error lines (error:) ==="
          grep -nE "error:|fatal error:" probe_pcie.txt | head -60 || true
          echo "=== error count ==="
          grep -cE "error:|fatal error:" probe_pcie.txt || true

      - name: Export kernel Image / rootfs squashfs (构造厂商兼容 FIT + 持久化安装用)
        if: always() && inputs.module_only != true
        run: |
          mkdir -p out
          # 1) 非 initramfs 的内核裸镜像（initramfs 版有 25MB，塞不进 bootfs1）
          IMG=$(find sources/openwrt/build_dir -path '*/arch/arm/boot/Image' -type f -not -path '*initramfs*' 2>/dev/null | head -1)
          [ -z "$IMG" ] && IMG=$(find sources/openwrt/build_dir -path '*/arch/arm/boot/Image' -type f 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            cp -v "$IMG" out/Image
            echo "Image: $(stat -c%s out/Image) 字节  ($IMG)"
          else
            echo "!! 未找到 Image"; find sources/openwrt/build_dir -name 'Image' -path '*arch/arm/boot*' 2>/dev/null | head -5
          fi

          # 2) 根文件系统 squashfs（写入 UBI rootfs1 卷，由 ubiblock 挂载）
          SQ=$(find sources/openwrt/build_dir -name 'root.squashfs' -type f 2>/dev/null | head -1)
          if [ -n "$SQ" ]; then
            cp -v "$SQ" out/root.squashfs
            echo "root.squashfs: $(stat -c%s out/root.squashfs) 字节"
          else
            echo "!! 未找到 root.squashfs"; find sources/openwrt/build_dir -name '*.squashfs' 2>/dev/null | head -5
          fi

          # 3) lzo 压缩内核（厂商 FIT 的 kernel 节点是 lzo）
          if [ -f out/Image ]; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y lzop >/dev/null 2>&1 || true
            if command -v lzop >/dev/null; then
              lzop -9 -f -o out/Image.lzo out/Image && echo "Image.lzo: $(stat -c%s out/Image.lzo) 字节"
            else
              echo "!! lzop 安装失败"
            fi
          fi

          # 4) 空的 UBIFS overlay 镜像（设备端没有 mkfs.ubifs，只能在这里预生成）
          #    几何参数由实机 UBI 决定：LEB=126976, min-io=2048(NAND 页 2048)
          #    OVERLAY_LEBS 必须与设备端 `ubimkvol -s <LEBS*126976>` 的 LEB 数一致
          sudo apt-get install -y mtd-utils >/dev/null 2>&1 || true
          if command -v mkfs.ubifs >/dev/null; then
            rm -rf /tmp/ovl_empty && mkdir -p /tmp/ovl_empty
            mkfs.ubifs -q -r /tmp/ovl_empty -m 2048 -e 126976 -c 128 -x zlib -o out/overlay.ubifs \
              && echo "overlay.ubifs: $(stat -c%s out/overlay.ubifs) 字节 (c=128, leb=126976)"
          else
            echo "!! mkfs.ubifs 不可用"
          fi

      - name: Collect artifacts
        if: always() && inputs.module_only != true
        run: |
          mkdir -p out
          # bcm_enet.ko：包没进镜像时也要能拿到，方便在设备上 insmod 验证
          KO=$(find sources/openwrt/build_dir -path '*bcm-enet*/bcm_enet.ko' -type f 2>/dev/null | head -1)
          if [ -n "$KO" ]; then
            cp -v "$KO" out/bcm_enet.ko
            echo "bcm_enet.ko: $(stat -c%s out/bcm_enet.ko) 字节"
          else
            echo "!! 没有 bcm_enet.ko（包编译失败或未编译）"
          fi
          find sources/openwrt/bin/targets -type f \( -name '*.bin' -o -name '*.ubi' -o -name '*.tar' \
            -o -name '*.itb' -o -name 'profiles.json' \) \
            -exec cp -v {} out/ \; || true
          [ -f build_error.txt ] && cp build_error.txt out/ || true
          ( cd out && sha256sum * > SHA256SUMS 2>/dev/null || true )
          ls -lh out/

      - name: Show build log tail on failure
        if: failure()
        run: |
          find sources/openwrt/logs -name '*.txt' 2>/dev/null | head -5 | xargs -r tail -n 60

      - name: Write timing summary
        if: always()
        run: |
          mkdir -p out
          if [ -f timing.marks ]; then
            start=$(awk '$1=="job_start"{print $2}' timing.marks)
            {
              echo "run=${{ github.run_number }} mode=$( [ "${{ inputs.module_only }}" = "true" ] && echo module-only || echo full )"
              echo "started=$(date -u -d "@$start" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo "$start")"
              echo "----- 步骤耗时（相对起始，秒） -----"
              awk -v s="$start" '$1!="job_start"{printf "%-16s %6d s\n", $1, $2-s}' timing.marks
              last=$(awk 'END{print $2}' timing.marks)
              echo "total            $((last-start)) s"
            } | tee out/timing.txt
          else
            echo "no timing.marks" | tee out/timing.txt
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.module_only && 'bcm-enet-module' || 'openwrt-mb4784w' }}-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # OpenWrt 自带的小写 sha256sums 上传 GitHub 会 404，已被我们自建的 SHA256SUMS 取代，兜底删除
          rm -f out/sha256sums
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅覆盖上传资产"
            gh release upload "$TAG" out/* --clobber
          else
            echo "创建 Release $TAG 并上传资产"
            gh release create "$TAG" \
              --title "HG3142F OpenWrt $TAG" \
              --notes "自动构建产物。**实验性**：bcmbca target 仍在移植中，刷机前核对 SHA256SUMS，并保留 mtd1 loader 原始备份。" \
              --prerelease
            gh release upload "$TAG" out/* --clobber
          fi

      # 缓存必须在构建之后保存：此时 staging_dir / dl 才真正存在
      - name: Save download directory cache
        continue-on-error: true
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sources/openwrt/dl
          key: openwrt-dl-${{ hashFiles('port/sources.lock.json') }}

      - name: Save toolchain cache
        continue-on-error: true
        if: always() && steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            sources/openwrt/staging_dir
            sources/openwrt/build_dir/toolchain-*
          key: openwrt-tc-${{ hashFiles('port/sources.lock.json') }}

      # 只有内核树完整（完整构建成功，或 module-only 自愈构建成功）才保存，
      # 避免把半成品缓存写进去导致后续 module-only 全部踩坏。
      - name: Save kernel build tree cache
        continue-on-error: true
        if: always() && steps.kernel-cache.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.module_build.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            sources/openwrt/build_dir/target-*/linux-*/
            sources/openwrt/staging_dir/target-*/
          key: openwrt-kernel-${{ hashFiles('port/sources.lock.json') }}-${{ hashFiles('port/overlay/target/linux/bcmbca/**') }}
